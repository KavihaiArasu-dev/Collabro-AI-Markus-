[project]
name = "markus-ai"
version = "0.1.0"
description = "Markus AI — Intelligent Multi-Agent Development Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Markus AI Team" }]

dependencies = [
    # Web backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # AI Gateway
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    # Agents
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    # RAG
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "unstructured>=0.14.0",
    # Databases
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "aiosqlite>=0.20.0",
    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    # Voice
    "sounddevice>=0.4.7",
    "numpy>=1.26.0",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.1",
    "edge-tts>=6.1.12",
    # Vision
    "opencv-python>=4.10.0",
    "mediapipe==0.10.14",
    "face-recognition>=1.3.0",
    "ultralytics>=8.2.0",
    "fer>=22.5.1",
    "pytesseract>=0.3.10",
    "pillow>=10.4.0",
    # Automation
    "pyautogui>=0.9.54",
    "selenium>=4.22.0",
    "psutil>=6.0.0",
    "pygetwindow>=0.0.9",
    # Logging / Utils
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pyright]
include = ["."]
extraPaths = ["venv/Lib/site-packages", "markus/venv/Lib/site-packages"]
reportMissingImports = "none"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
